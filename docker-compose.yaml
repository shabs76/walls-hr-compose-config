networks:
  walls_net:

volumes:
  mariadb:
  phpmyadmin:
  certbot:

services:
  notification_app:
    image: 081653452993.dkr.ecr.us-east-1.amazonaws.com/wallstz/notifications-services:latest
    container_name: walls_notifications_app
    expose:
      - "1700"  # Expose port 1700 for internal communication
    env_file:
      - notifications_config/.env
    networks:
      -  walls_net
    restart: unless-stopped
  media_app:
    image: 081653452993.dkr.ecr.us-east-1.amazonaws.com/wallstz/media-service:latest
    container_name: walls_media_app
    expose:
      - "1500"  # Expose port 1500 for internal communication
    env_file:
      - media_config/.env
    networks:
      -  walls_net
    restart: unless-stopped
  hr_app:
    image: 081653452993.dkr.ecr.us-east-1.amazonaws.com/wallstz/hr-services:latest
    container_name: walls_hr_app
    expose:
      - "2400"  # Expose port 2400 for internal communication
    env_file:
      - hr_config/.env
    networks:
      -  walls_net
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
  hr_terminal_app:
    image: 081653452993.dkr.ecr.us-east-1.amazonaws.com/wallstz/hr-terminal:latest
    container_name: walls_hr_terminal
    expose:
      - "4000"
    env_file:
      - hr_terminal_config/.env
    networks:
      - walls_net
    restart: unless-stopped
  mariadb:
    image: mariadb:latest
    container_name: walls-maria-server
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306"  # Internal only — reachable over walls_net, not published to the host
    volumes:
      - mariadb:/var/lib/mysql/
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    networks:
      - walls_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2.1-fpm
    container_name: walls-phpmyadmin-server
    environment:
      PMA_HOST: mariadb
    volumes:
      - phpmyadmin:/var/www/html
    networks:
      - walls_net
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: walls-nginx-phpmyadmin-server
    volumes:
      - ./db_nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - phpmyadmin:/var/www/html/:ro
    ports:
      - "490:80"
    networks:
      - walls_net
    depends_on:
      mariadb:
        condition: service_healthy
      phpmyadmin:
        condition: service_started
    restart: unless-stopped
  nginx-go:
    image: nginx:latest
    container_name: walls-nginx-go
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - walls_net
    depends_on:
      # nginx.conf resolves these upstreams by container name at config-load time,
      # so all three must exist or nginx-go exits with "host not found in upstream"
      - media_app
      - hr_app
      - hr_terminal_app
    restart: unless-stopped
  db_backup:
    build: ./db_backup
    container_name: walls-db-backup
    env_file:
      - backup_config/.env
    networks:
      - walls_net
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # Goes unhealthy if no backup has succeeded in 13h (backups run every 12h),
      # so a silently failing backup shows up in `docker compose ps`
      test: ["CMD-SHELL", "[ $(( $(date +%s) - $(stat -c %Y /var/run/last_backup_success 2>/dev/null || echo 0) )) -lt 46800 ]"]
      interval: 5m
      timeout: 10s
      retries: 3
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw